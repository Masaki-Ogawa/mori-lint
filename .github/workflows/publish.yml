name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use latest npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm install
      - run: npm test
      - name: Check whether this version is already published
        id: gate
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view mori-lint version 2>/dev/null || echo "none")
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (OIDC trusted publishing, no token)
        if: steps.gate.outputs.skip != 'true'
        run: npm publish --provenance --access public
