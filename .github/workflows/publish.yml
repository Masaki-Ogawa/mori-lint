name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use latest npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - run: npm install
      - run: npm test
      - name: Check whether this version is already published
        id: gate
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          PUBLISHED=$(npm view mori-lint version 2>/dev/null || echo "none")
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm (OIDC trusted publishing, no token)
        if: steps.gate.outputs.skip != 'true'
        run: npm publish --provenance --access public
      - name: Create GitHub Release (notes from CHANGELOG.md)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          TAG="v$V"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          awk -v v="$V" '/^## /{f=index($0,"## " v " ")==1; next} f' CHANGELOG.md > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest
